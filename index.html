<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HIERA Board Pitch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: the masterplan sits on a deep emerald stage like a framed print; talking points sit on an off-white sheet beside it, set like a developer's brochure page. HIERA brand palette only. */
:root{
  --emerald:#0F3E2E;      /* stage */
  --emerald-2:#164a38;    /* stage, raised */
  --burgundy:#8A132B;     /* Heartland, emphasis */
  --gold:#D4AF37;         /* rules, active state, Gateway */
  --teal:#237080;         /* Waterfront, HIERA Eki */
  --paper:#F8F9FA;        /* sheet */
  --charcoal:#2A2A2A;     /* text on sheet */
  --ink-2:#5c6662;        /* secondary text on sheet */
  --hair:#dde2df;         /* hairlines on sheet */
  --on-stage:#F8F9FA;
  --on-stage-2:#a9c0b5;   /* secondary text on stage */
  --stage-hair:#2b5c4a;
  --loop:#3e8a5f;         /* Loop marks on the photo, a lifted emerald */
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Times New Roman",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Segoe UI",system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--emerald);color:var(--on-stage);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--emerald)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.app{display:grid;grid-template-rows:auto 1fr auto;height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;padding-block:14px 0;border-bottom:1px solid var(--stage-hair)}
.brand{display:flex;align-items:baseline;gap:14px;min-width:0;padding-bottom:12px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.22em;margin:0;color:var(--gold)}
.brand span{color:var(--on-stage-2);font-size:12.5px;letter-spacing:.03em}
.acts{display:flex;gap:2px 20px;flex-wrap:wrap;margin-left:auto}
.acts button{background:none;border:0;border-bottom:2px solid transparent;padding:4px 0 12px;font-size:13px;color:var(--on-stage-2);letter-spacing:.02em;margin-bottom:-1px}
.acts button:hover{color:var(--on-stage)}
.acts button[aria-pressed="true"]{color:var(--on-stage);border-bottom-color:var(--gold)}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:22px;min-height:0;padding-block:18px}
.mapwrap{min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px}
.map{position:relative;width:min(100%,calc((100dvh - 210px) * 2.29));aspect-ratio:1500/655;max-width:100%;overflow:hidden;background:#0b2c21;outline:1px solid rgba(212,175,55,.45);outline-offset:5px}
.map img{display:block;width:100%;height:100%;object-fit:cover;transition:filter .3s}
.map.dim img{filter:brightness(.7) saturate(.9)}
.map svg.zones{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity .35s}
.map.show-zones svg.zones{opacity:1}
.zlabel{font-family:var(--f-body);font-weight:700;font-size:21px;letter-spacing:.16em}

/* hotspots */
.hs{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;border:0;background:transparent;padding:0}
.hs::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:3px solid var(--c);box-shadow:0 0 0 2px var(--paper);opacity:0;transform:scale(.7);transition:opacity .2s,transform .2s}
.hs:hover::after,.hs:focus-visible::after{opacity:.9;transform:scale(1)}
.hs.active::after{opacity:1;transform:scale(1);animation:ping 2s ease-out infinite}
.hs.related::after{opacity:.55;transform:scale(.9)}
.hs:focus-visible{outline:none}
@keyframes ping{0%{box-shadow:0 0 0 2px var(--paper),0 0 0 2px var(--c)}70%{box-shadow:0 0 0 2px var(--paper),0 0 0 16px transparent}100%{box-shadow:0 0 0 2px var(--paper),0 0 0 2px transparent}}

.legend{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:12.5px;color:var(--on-stage-2);padding-top:6px}
.legend .sw{display:inline-block;width:14px;height:3px;margin-right:7px;vertical-align:3px}
.toggle{margin-left:auto}
.toggle button{background:none;border:1px solid var(--stage-hair);padding:4px 12px;font-size:12.5px;color:var(--on-stage-2)}
.toggle button:hover{color:var(--on-stage)}
.toggle button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.kbd{font-size:10.5px;opacity:.7;margin-left:4px}

/* sheet */
.drawer{background:var(--paper);color:var(--charcoal);display:flex;flex-direction:column;min-height:0;overflow:hidden;border-top:3px solid var(--gold)}
.d-head{padding:20px 24px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:16px;align-items:start;border-bottom:1px solid var(--hair)}
.numeral{font-family:var(--f-display);font-weight:500;font-size:46px;line-height:.9;color:var(--c);font-variant-numeric:lining-nums tabular-nums;min-width:1.2em}
.d-head.solo{grid-template-columns:minmax(0,1fr)}
.d-title{min-width:0}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.eyebrow .place{color:var(--charcoal);font-weight:700}
.d-title h2{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.3;margin:6px 0 0;text-wrap:balance;color:var(--charcoal)}
.d-body{padding:4px 24px 22px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:16px}
.points{margin:0;padding:0;list-style:none}
.points li{font-size:15.5px;line-height:1.55;padding:11px 0;border-bottom:1px solid var(--hair)}
.points li:last-child{border-bottom:0}
.points b{font-weight:700;color:var(--charcoal)}
.num{font-weight:700;font-variant-numeric:tabular-nums;color:var(--burgundy)}
.tags{font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 0}
.tags span+span::before{content:"·";margin:0 8px;color:var(--gold)}
details.deep{border-top:1px solid var(--hair);padding-top:12px}
details.deep summary{cursor:pointer;font-size:13.5px;font-weight:700;color:var(--burgundy);list-style:none;display:inline-flex;align-items:center;gap:6px}
details.deep summary::-webkit-details-marker{display:none}
details.deep summary::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .2s}
details.deep[open] summary::after{transform:rotate(225deg) translateY(-1px)}
.deep-in{margin-top:10px;display:flex;flex-direction:column;gap:9px;font-size:14px;color:#3d4441}
.deep-in p{margin:0}
.src{font-size:12px;color:var(--ink-2)}
.src a{color:var(--ink-2)}
.deep-in a{color:var(--teal)}
.label{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:500;margin-top:6px}

/* tables on sheet */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--hair);vertical-align:top}
th{font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);border-bottom:1.5px solid var(--charcoal)}
td.r{text-align:right;font-variant-numeric:tabular-nums}
.lvl{font-size:12px;font-weight:700;white-space:nowrap}
.lvl.hi{color:var(--burgundy)}.lvl.md{color:#8a6d12}.lvl.lo{color:var(--teal)}
.lvl.ok{color:var(--teal)}

/* figures */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px}
.stat{padding:10px 0;border-bottom:1px solid var(--hair)}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:24px;font-variant-numeric:lining-nums tabular-nums;color:var(--charcoal);line-height:1.15}
.stat .k{font-size:12.5px;color:var(--ink-2);line-height:1.4}
.stat .v.neg{color:var(--burgundy)}.stat .v.pos{color:var(--teal)}

/* phases */
.phases{display:flex;flex-direction:column}
.ph{display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--hair)}
.ph:last-child{border-bottom:0}
.ph .yr{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--burgundy);line-height:1.3;font-variant-numeric:lining-nums}
.ph h4{margin:0 0 3px;font-size:15px;font-weight:700}
.ph p{margin:0;font-size:13.5px;color:#3d4441}
.ph .gate{margin-top:6px;font-size:12.5px;color:var(--ink-2);font-style:italic}

/* story rail */
.rail{display:flex;align-items:center;gap:16px;padding-block:10px 14px;border-top:1px solid var(--stage-hair);flex-wrap:wrap}
.rail .nav{display:flex;gap:6px}
.rail .nav button{background:none;border:1px solid var(--stage-hair);width:38px;height:32px;color:var(--on-stage)}
.rail .nav button:hover{border-color:var(--gold);color:var(--gold)}
.steps{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;align-items:center}
.steps button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:4px 7px;font-size:12px;color:var(--on-stage-2);font-variant-numeric:tabular-nums}
.steps button:hover{color:var(--on-stage)}
.steps button.on{color:var(--on-stage);border-bottom-color:var(--gold);font-weight:700}
.steps .sep{width:1px;height:14px;background:var(--stage-hair);margin:0 6px;flex:none}
.pos{font-size:12px;color:var(--on-stage-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.foot{font-size:11.5px;color:var(--on-stage-2);margin:0;max-width:70ch}

@media (max-width:980px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .map{width:100%}
  .app{height:auto;min-height:100%}
}
@media (max-width:560px){
  .hs{width:26px;height:26px}
  .brand h1{font-size:20px}
  .acts{margin-left:0}
  .toggle{margin-left:0}
  .d-head{padding:16px 16px 12px}
  .d-body{padding:4px 16px 18px}
  .numeral{font-size:36px}
}
@media (prefers-reduced-motion:reduce){
  .hs.active::after{animation:none}
  *{transition:none!important}
}
</style>
</head>

thesis:{kind:"panel",badge:"Thesis",c:"bronze",eyebrow:"Opening · The thesis",

  "Widen the product ladder <b>down and sideways, not up</b>. Station homes from IDR 1.7B, shophouses, a station plaza and rental; the Heartland stays at IDR 3–7.5B, capped at IDR 10B below NavaPark.",

  "One claim for the market: <b>calm, green living with Jakarta one train ride away.</b>"
 ],
 deep:`<p>Indicative scale: about <span class="num">3,900–4,200</span> homes and <span class="num">~300</span> shophouses over four phases from 2027, plus retained income assets (rental housing, plaza, lifestyle centre).</p>
 <p>Mix shift by unit count: roughly <span class="num">41%</span> premium landed, <span class="num">20%</span> station landed, <span class="num">38%</span> apartments. Premium landed still carries most of the land and most of the revenue.</p>

"8":{kind:"spot",act:"gateway",c:"infra",label:"Jatake Train Station",eyebrow:"Act I · Gateway",
 title:"The station is live. The question is who captures its value",
 points:[
  "Opened <b>28 Jan 2026</b> on the KRL Green Line. My masterplan copy still says \"future\"; that is the outside-in view, and the reality is better.",
  "<span class=\"num\">192</span> trips a day, about <span class=\"num\">45–50 min</span> to Tanah Abang.",
  "Design capacity <span class=\"num\">20,000</span> passengers a day; KAI projects ~<span class=\"num\">6,000</span>. Early days ran near 1,000 tap-ins. The headroom is HIERA's to fill.",
  "No other BSD township has a station <b>inside</b> its gates. This is the one asset rivals cannot copy."
 ],
 deep:`<p>Built through KAI–BSDE creative financing (~IDR 100B, no state budget). Benchmark: BSD's Intermoda TOD at Cisauk handled 9.27M rail and bus passengers in 2025, and Sinar Mas Land launched Wander Alley Walk on that traffic.</p>
 <p>Model the walk-to-train premium as building over time, not earned at launch. Gate 1 is tied to tap-ins trending toward 6,000 a day.</p>
 <p>Risk HIERA cannot control: Green Line reliability. Opening day saw a broken rail near Serpong.</p>
 <p class="src">${L("Bisnis: opening day","https://ekonomi.bisnis.com/read/20260128/98/1947856/penampakan-stasiun-jatake-yang-mulai-beroperasi-hari-ini")} · ${L("Bisnis: first four days","https://ekonomi.bisnis.com/read/20260201/98/1949016/beroperasi-4-hari-stasiun-jatake-layani-lebih-dari-5000-pengguna-krl")} · ${L("CNBC Indonesia","https://www.cnbcindonesia.com/news/20260128125907-7-705986/warga-bsd-punya-stasiun-krl-sendiri-tektok-ke-jakarta-makin-cepat")}</p>`,
 chips:[["Operating","c-infra"],["Gate 1 metric",""]]},

phasing:{kind:"panel",badge:"Phasing",c:"bronze",eyebrow:"Plan · Gated phasing",
 title:"Each phase opens only when the last one proves demand",
 html:()=>`<div class="phases">
  <div class="ph"><div class="yr">2027–28</div><div><h4>1 · Prove the station</h4><p>Station Homes batch 1 (~150), Shophouses batch 1 (~60), Water Front meanwhile uses, first lit loop segment. Welton and Wynyard keep selling.</p><div class="gate">Gate: tap-ins trending to ~6,000/day · ≥70% of batch sold in 6 months · ≥50% shophouses trading</div></div></div>
  <div class="ph"><div class="yr">2028–30</div><div><h4>2 · Anchor and densify</h4><p>Station Plaza with retail anchor, Lofts tower 1, Residences for Rent block 1, Station Homes batch 2. Dairyland opens end-2028.</p><div class="gate">Gate: anchor signed · tower ≥60% pre-sold · rental ≥80% leased</div></div></div>
  <div class="ph"><div class="yr">2030–32</div><div><h4>3 · Premium upside</h4><p>Lakefront Editions, remaining Welton and Wynyard pods, further Eki blocks.</p><div class="gate">Gate: Heartland resale at or above launch · KEK ETKI jobs rising</div></div></div>
  <div class="ph"><div class="yr">2032+</div><div><h4>4 · Complete and hold</h4><p>Final pods, civic plots, stabilised income assets.</p><div class="gate">Exit or refinance the retained-asset portfolio</div></div></div>
 </div>`,
 deep:`<p>Sequencing logic: lead with low-risk landed and shophouse product to test transit demand; keep the Heartland selling to fund front-loaded amenities; add rental and the plaza once there are residents and commuters to serve.</p>`},

 title:"Give me the data room, and I'll turn this into a bankable plan",
 html:()=>`<div class="phases">
  <div class="ph"><div class="yr">Wk 1–2</div><div><h4>Agree direction</h4><p>Agreement on the strategy direction and data access.</p></div></div>
  <div class="ph"><div class="yr">Wk 2–4</div><div><h4>Data room and site visit</h4><p>Approved site plan, Welton and Wynyard absorption, parcels within 10 minutes of Jatake, JV return hurdles.</p></div></div>
  <div class="ph"><div class="yr">Wk 4–8</div><div><h4>Financial feasibility</h4><p>Proposed mix vs all-premium plan; walk-to-train premium; retained vs sold assets; sensitivity to absorption, rates and ridership.</p></div></div>
  <div class="ph"><div class="yr">Wk 6–12</div><div><h4>Eki concept plan and partner sounding</h4><p>Phase 1 product briefs; indicative interest from KAI, AEON and tenant partners.</p></div></div>
 </div>`,
 deep:`<p>Questions only the JV can answer: hectares already committed to Welton, Wynyard and infrastructure; zoning and FAR near the station; how Mitbana and Sinar Mas Land each view retained income versus sell-down; existing commitments for the TOD mall and apartments; appetite for a HIERA Eki sub-brand.</p>`}
};

const ACTS=[
 {id:"open",label:"Thesis",steps:["thesis","market"]},
 {id:"gateway",label:"I · Gateway",steps:["8","6","7"]},
 {id:"heartland",label:"II · Heartland",steps:["1","2","11","12"]},
 {id:"eki",label:"III · HIERA Eki",steps:["9","10","3"]},
 {id:"destination",label:"IV · Destination",steps:["5","4"]},
 {id:"plan",label:"Phasing · Partners · Risks",steps:["phasing","partners","risks"]},
 {id:"close",label:"Close",steps:["close"]}
];
const ORDER=ACTS.flatMap(a=>a.steps);
let cur=0;

const $=s=>document.querySelector(s);
const map=$("#map"), hsWrap=$("#hotspots"), drawer=$("#drawer");

/* hotspots */
for(const [id,pts] of Object.entries(SPOTS)){
  const it=ITEMS[id];
  pts.forEach(([x,y])=>{
    const b=document.createElement("button");
    b.className="hs"; b.dataset.id=id;
    b.style.left=(x/1500*100)+"%"; b.style.top=(y/655*100)+"%";
    b.style.setProperty("--c",C[it.c]);
    b.setAttribute("aria-label",`${id} · ${it.label}`);
    b.addEventListener("click",()=>go(ORDER.indexOf(id)));
    hsWrap.appendChild(b);
  });
}

/* acts */
const actsNav=$("#acts");
ACTS.forEach(a=>{
  const b=document.createElement("button");
  b.textContent=a.label; b.dataset.act=a.id;
  b.addEventListener("click",()=>go(ORDER.indexOf(a.steps[0])));
  actsNav.appendChild(b);
});

/* steps rail */
const stepsEl=$("#steps");
ACTS.forEach((a,ai)=>{
  if(ai) {const s=document.createElement("span");s.className="sep";stepsEl.appendChild(s);}
  a.steps.forEach(id=>{
    const it=ITEMS[id]; const b=document.createElement("button");
    b.textContent=it.kind==="spot"?id:(it.badge||id);
    b.title=it.kind==="spot"?it.label:it.eyebrow;
    b.style.setProperty("--c",C[it.c]);
    b.dataset.id=id;
    b.addEventListener("click",()=>go(ORDER.indexOf(id)));
    stepsEl.appendChild(b);
  });
});

function render(id){
  const it=ITEMS[id];
  const col=C[it.c];
  const numeral=it.kind==="spot"?id.padStart(2,"0"):"";
  const eyebrow=it.kind==="spot"?`${it.eyebrow} · <span class="place">${it.label}</span>`:it.eyebrow;
  drawer.style.setProperty("--c",col);
  drawer.innerHTML=`
   <div class="d-head${numeral?"":" solo"}">${numeral?`<div class="numeral">${numeral}</div>`:""}
    <div class="d-title"><div class="eyebrow">${eyebrow}</div><h2>${it.title}</h2></div></div>
   <div class="d-body">
    ${it.points?`<ul class="points">${it.points.map(p=>`<li>${p}</li>`).join("")}</ul>`:""}
    ${it.html?it.html():""}
    ${it.chips?`<div class="tags">${it.chips.map(([t])=>`<span>${t}</span>`).join("")}</div>`:""}
    ${it.deep?`<details class="deep"><summary>More detail</summary><div class="deep-in">${it.deep}</div></details>`:""}
   </div>`;
  drawer.querySelector(".d-body").scrollTop=0;
}

function go(i){
  cur=Math.max(0,Math.min(ORDER.length-1,i));
  const id=ORDER[cur]; const it=ITEMS[id];
  render(id);
  document.querySelectorAll(".hs").forEach(h=>{h.classList.toggle("active",h.dataset.id===id);h.classList.remove("related");});
  map.classList.toggle("dim",it.kind==="spot");
  const act=ACTS.find(a=>a.steps.includes(id));
  if(it.kind==="spot") act.steps.forEach(s=>{ if(s!==id) document.querySelectorAll(`.hs[data-id="${s}"]`).forEach(h=>h.classList.add("related"));});
  document.querySelectorAll("#acts button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.act===act.id)));
  document.querySelectorAll("#steps button").forEach(b=>b.classList.toggle("on",b.dataset.id===id));
  const on=stepsEl.querySelector("button.on"); if(on) on.scrollIntoView({block:"nearest",inline:"nearest"});
  $("#pos").textContent=`${cur+1} / ${ORDER.length}`;
  try{localStorage.setItem("hiera-step",String(cur))}catch(e){}
}

$("#prev").addEventListener("click",()=>go(cur-1));
$("#next").addEventListener("click",()=>go(cur+1));
const tZ=$("#tZones");
function zones(on){map.classList.toggle("show-zones",on);tZ.setAttribute("aria-pressed",String(on));}
tZ.addEventListener("click",()=>zones(!map.classList.contains("show-zones")));
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea")) return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){e.preventDefault();go(cur+1);}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();go(cur-1);}
  else if(e.key==="d"||e.key==="D"){zones(!map.classList.contains("show-zones"));}
  else if(e.key==="Home"){go(0);}
});

let start=0; try{const s=parseInt(localStorage.getItem("hiera-step")||"0",10); if(!isNaN(s)) start=s;}catch(e){}
go(start);
</script>

</body>
</html>
